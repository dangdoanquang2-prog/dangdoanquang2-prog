<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho hàng & Sản phẩm - NovaPOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <script src="authGuard.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon"><i class='bx bx-cube-alt'></i></div>
                <h1 class="logo-text">Nova<span>POS</span></h1>
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class='bx bx-grid-alt'></i>
                    <span>Tổng quan</span>
                </a>
                <a href="pos.html" class="nav-item">
                    <i class='bx bx-cart'></i>
                    <span>Bán hàng (POS)</span>
                </a>
                <a href="inventory.html" class="nav-item active">
                    <i class='bx bx-package'></i>
                    <span>Kho hàng</span>
                </a>
                <a href="online_orders.html" class="nav-item">
                    <i class='bx bx-world'></i>
                    <span>Đơn Online (Geo)</span>
                </a>
                <a href="orders.html" class="nav-item">
                    <i class='bx bx-receipt'></i>
                    <span>Lịch sử Hóa đơn</span>
                </a>
                <a href="customers.html" class="nav-item">
                    <i class='bx bx-user-circle'></i>
                    <span>Khách hàng</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header inventory-header">
                <div class="header-left">
                    <h2 class="page-title">Quản lý Kho hàng & Sản phẩm</h2>
                    <p class="current-date">Sử dụng dữ liệu cấu trúc lồng ghép chuẩn Geo-Scanning</p>
                </div>
                
                <div class="header-right actions">
                    <input type="file" id="csvFileInput" accept=".csv" style="display: none;" />
                    <button id="btnImportCSV" class="btn warning-btn" style="background: rgba(245, 158, 11, 0.1); color: var(--status-warning); border: 1px solid rgba(245, 158, 11, 0.3);">
                        <i class='bx bx-import'></i> Nhập dữ liệu CSV
                    </button>
                    <button id="btnExportCSV" class="btn primary-btn">
                        <i class='bx bx-export'></i> Xuất báo cáo CSV
                    </button>
                </div>
            </header>

            <section class="inventory-controls">
                <input type="file" id="productImageUploader" accept="image/*" style="display:none">
                <div class="filters">
                    <div class="search-box">
                        <i class='bx bx-search'></i>
                        <input type="text" id="invSearchBox" placeholder="Tìm sản phẩm theo Tên / Mã SP...">
                    </div>
                    <select id="warehouseFilter" class="modern-select">
                        <option value="ALL">Tất cả kho (Toàn quốc)</option>
                        <!-- Danh sách kho sẽ được tải tự động -->
                    </select>
                </div>
            </section>

            <section class="panel inventory-data-panel">
                <div class="table-container">
                    <table class="data-table inventory-table">
                        <thead>
                            <tr>
                                <th style="width: 80px;">Mã SP</th>
                                <th style="width: 80px;">Hình Ảnh</th>
                                <th>Sản Phẩm</th>
                                <th>Phân Loại</th>
                                <th>Giá bán</th>
                                <th>Kho Chứa (Chi nhánh)</th>
                                <th>Tồn kho</th>
                                <th>Thao tác nhanh</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTableBody">
                            <!-- JS tự động tải dữ liệu vào đây -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="inventory.js"></script>
</body>
</html>
