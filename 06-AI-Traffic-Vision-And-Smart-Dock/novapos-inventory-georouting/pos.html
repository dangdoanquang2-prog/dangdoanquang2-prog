<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bán hàng (POS) - NovaPOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <script src="authGuard.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar (giống file index.html) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon"><i class='bx bx-cube-alt'></i></div>
                <h1 class="logo-text">Nova<span>POS</span></h1>
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class='bx bx-grid-alt'></i>
                    <span>Tổng quan</span>
                </a>
                <a href="pos.html" class="nav-item active">
                    <i class='bx bx-cart'></i>
                    <span>Bán hàng (POS)</span>
                </a>
                <a href="inventory.html" class="nav-item">
                    <i class='bx bx-package'></i>
                    <span>Kho hàng</span>
                </a>
                <a href="online_orders.html" class="nav-item">
                    <i class='bx bx-world'></i>
                    <span>Đơn Online (Geo)</span>
                </a>
                <a href="orders.html" class="nav-item">
                    <i class='bx bx-receipt'></i>
                    <span>Lịch sử Hóa đơn</span>
                </a>
                <a href="customers.html" class="nav-item">
                    <i class='bx bx-user-circle'></i>
                    <span>Khách hàng</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content cho POS -->
        <main class="main-content pos-layout">
            
            <!-- Cột trái: Danh sách Sản phẩm -->
            <section class="pos-products-area">
                <header class="pos-header">
                    <h2>Màn hình Thu Ngân</h2>
                    <div class="search-box">
                        <i class='bx bx-search'></i>
                        <input type="text" id="posSearch" placeholder="Tìm sản phẩm theo tên hoặc mã...">
                    </div>
                </header>

                <div class="products-grid" id="posProductList">
                    <!-- Danh sách sản phẩm sẽ được tự động đổ vào đây từ pos.js -->
                </div>
            </section>

            <!-- Cột phải: Giỏ hàng -->
            <aside class="pos-cart-area">
                <div class="cart-header">
                    <h3>Giỏ hàng hiện tại</h3>
                    <button class="clear-cart-btn" id="btnXoaGio"><i class='bx bx-trash'></i> Xóa mã</button>
                </div>

                <div class="cart-items" id="cartItemList">
                    <!-- Dữ liệu giỏ hàng sẽ hiện ở đây -->
                    <div class="empty-cart-msg">Chưa có sản phẩm nào trong giỏ.</div>
                </div>

                <div class="cart-summary">
                    <div class="summary-row" style="margin-bottom: 20px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom:15px; display:block;">
                        <span style="font-size: 13px; color:var(--text-secondary); display:block; margin-bottom:8px;"><i class='bx bx-git-branch'></i> Nguồn Xuất Kho:</span>
                        <select id="checkoutSourceWarehouse" class="pos-input" style="width: 100%; border: 1px solid rgba(59,130,246,0.4); background: rgba(15,23,42,0.8); color: white; padding: 10px; border-radius: 6px; outline:none; font-size:13px; cursor:pointer;">
                            <!-- Đợi JS nạp options -->
                        </select>
                    </div>
                    <div class="summary-row">
                        <span>Tạm tính</span>
                        <span id="cartSubtotal">0 đ</span>
                    </div>
                    <div class="summary-row">
                        <span>Giảm giá (Mặc định 0%)</span>
                        <span>0 đ</span>
                    </div>
                    <div class="summary-row total-row">
                        <span>Tổng tiền</span>
                        <h2 id="cartTotal">0 đ</h2>
                    </div>
                    <button class="checkout-btn" id="btnThanhToan">
                        <i class='bx bx-check-circle'></i> Thanh toán & In Bill
                    </button>
                </div>
            </aside>

        </main>
    </div>

    <!-- Khung giao diện in hóa đơn giấy (Bình thường sẽ ẩn) -->
    <div id="printBillDiv" class="print-bill-container">
        <!-- JS sẽ bơm nội dung HTML cho Bill vào đây -->
    </div>

    <!-- Script xử lý giỏ hàng -->
    <script src="pos.js"></script>
</body>
</html>
