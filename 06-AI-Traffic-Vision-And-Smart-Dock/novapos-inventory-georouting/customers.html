<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khách hàng (CRM) - NovaPOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <script src="authGuard.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon"><i class='bx bx-cube-alt'></i></div>
                <h1 class="logo-text">Nova<span>POS</span></h1>
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class='bx bx-grid-alt'></i>
                    <span>Tổng quan</span>
                </a>
                <a href="pos.html" class="nav-item">
                    <i class='bx bx-cart'></i>
                    <span>Bán hàng (POS)</span>
                </a>
                <a href="inventory.html" class="nav-item">
                    <i class='bx bx-package'></i>
                    <span>Kho hàng</span>
                </a>
                <a href="online_orders.html" class="nav-item">
                    <i class='bx bx-world'></i>
                    <span>Đơn Online (Geo)</span>
                </a>
                <a href="orders.html" class="nav-item">
                    <i class='bx bx-receipt'></i>
                    <span>Lịch sử Hóa đơn</span>
                </a>
                <a href="customers.html" class="nav-item active">
                    <i class='bx bx-user-circle'></i>
                    <span>Khách hàng</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header inventory-header">
                <div class="header-left">
                    <h2 class="page-title">Quản lý Khách Hàng (CRM)</h2>
                    <p class="current-date">Theo dõi tổng chi tiêu để phân hạng Thẻ thành viên</p>
                </div>
            </header>

            <section class="inventory-controls">
                <div class="filters">
                    <div class="search-box">
                        <i class='bx bx-search'></i>
                        <input type="text" id="crmSearchBox" placeholder="Tìm tên hoặc SĐT khách...">
                    </div>
                </div>
            </section>

            <section class="panel inventory-data-panel">
                <div class="table-container">
                    <table class="data-table inventory-table">
                        <thead>
                            <tr>
                                <th>Mã KH</th>
                                <th>Tên Khách Hàng</th>
                                <th>Số Điện Thoại</th>
                                <th>Tổng Số Đơn</th>
                                <th>Tổng Chi Tiêu</th>
                                <th>Hạng Thẻ (Rank)</th>
                            </tr>
                        </thead>
                        <tbody id="crmTableBody">
                            <!-- JS tự động tải dữ liệu vào đây -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="customers.js"></script>
</body>
</html>
